[build]
  publish = "."
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "18"

# v107: erlaubt der Vorlesestimme mehrere CPU-Kerne (2–4× schneller)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# v154: Account-Tracking – alle 30 Min. (Netlify-Gratisplan: Rechenzeit kostet Credits)
[functions."bs-cron"]
  schedule = "*/30 * * * *"

# v117: Community-Meta – Battlelogs von Top-Spielern für Tagesplan & Upgrade-Planer
[functions."bs-sample"]
  schedule = "0 */6 * * *"

# v118: öffentlicher Profil-Link  /p/TAG  → Seite mit Vorschaubild, leitet zum Profil weiter
[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/bs-profil?tag=:splat"
  status = 200
  force = true

# v138: Pro-Sheet alle 5 Minuten mit 30 s Zeit holen und in Supabase ablegen – fetch-pro-sheet liest die Kopie
[functions."pro-sheet-sync"]
  schedule = "0 */3 * * *"

# v148: Bilder & Lobby-Videos länger im Browser behalten – spart Netlify-Bandbreite und Anfragen
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
