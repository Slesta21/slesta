[build]
  publish = "."
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "18"

# v107: erlaubt der Vorlesestimme mehrere CPU-Kerne (2–4× schneller)
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"

# v110: Account-Tracking – läuft alle 10 Minuten: aktive Spieler jedes Mal, alle anderen alle 30 Minuten
[functions."bs-cron"]
  schedule = "*/10 * * * *"

# v117: Community-Meta – Battlelogs von Top-Spielern für Tagesplan & Upgrade-Planer
[functions."bs-sample"]
  schedule = "*/30 * * * *"

# v118: öffentlicher Profil-Link  /p/TAG  → Seite mit Vorschaubild, leitet zum Profil weiter
[[redirects]]
  from = "/p/*"
  to = "/.netlify/functions/bs-profil?tag=:splat"
  status = 200
  force = true

# v138: Pro-Sheet alle 5 Minuten mit 30 s Zeit holen und in Supabase ablegen – fetch-pro-sheet liest die Kopie
[functions."pro-sheet-sync"]
  schedule = "*/5 * * * *"
